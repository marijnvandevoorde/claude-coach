name: CI

# Typecheck + tests on every PR and on pushes to main. Also the gate Dependabot
# auto-merge relies on (its workflow runs the same steps before merging).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
