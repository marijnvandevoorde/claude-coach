name: CI

# Format check, typecheck + tests on every PR. Also the gate Dependabot
# auto-merge waits for before merging.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
