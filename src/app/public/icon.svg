<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Coach">
  <!-- warm-cream field (lagoon background_color) -->
  <rect width="512" height="512" rx="112" fill="#f6f1e7"/>
  <!-- readiness ring: a teal ¾-sweep, gap at the bottom-right -->
  <g fill="none" stroke-linecap="round">
    <!-- faint full track -->
    <circle cx="256" cy="256" r="150" stroke="#dcd6c8" stroke-width="44"/>
    <!-- ¾ sweep (270°), teal accent; rotated so the gap sits bottom-right -->
    <circle cx="256" cy="256" r="150"
            stroke="#1f93a6" stroke-width="44"
            stroke-dasharray="707 236"
            transform="rotate(135 256 256)"/>
  </g>
</svg>
