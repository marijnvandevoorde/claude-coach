<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coach</title>

    <!-- Fonts: Space Grotesk (display) + IBM Plex Mono (numerics/labels). These
         load in the user's browser; no server egress concern. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- PWA / installable. icon.svg + manifest live in public/ so they keep
         stable, unhashed /app/ URLs (the manifest's own icon src needs that). -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <link rel="apple-touch-icon" href="/app/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2a2622" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
