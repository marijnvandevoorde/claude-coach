<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coach · App mockup</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #1a1d23;
        --card2: #21252d;
        --line: #2b313b;
        --text: #e6e8eb;
        --muted: #8b929e;
        --green: #3fb950;
        --amber: #d6a020;
        --red: #f85149;
        --blue: #4c8dff;
        --accent: #5b9cff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07080a;
      }
      body {
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--text);
        display: flex;
        justify-content: center;
      }
      #frame {
        width: 100%;
        max-width: 430px;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      }
      header {
        padding: 14px 16px 10px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        position: sticky;
        top: 0;
        background: linear-gradient(var(--bg), var(--bg) 70%, transparent);
        z-index: 5;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 650;
      }
      header .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .banner {
        background: #2a2410;
        color: #e8c14a;
        font-size: 11.5px;
        text-align: center;
        padding: 4px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 4px 14px 96px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin: 10px 0;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 12px;
      }
      .big {
        font-size: 30px;
        font-weight: 700;
      }
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .tap {
        cursor: pointer;
      }
      /* nav */
      nav {
        position: sticky;
        bottom: 0;
        display: flex;
        background: #14171d;
        border-top: 1px solid var(--line);
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 430px;
        bottom: 0;
      }
      nav button {
        flex: 1;
        background: none;
        border: 0;
        color: var(--muted);
        padding: 9px 0 11px;
        font-size: 10.5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        min-height: 52px;
      }
      nav button .ico {
        font-size: 19px;
        line-height: 1;
      }
      nav button.active {
        color: var(--accent);
      }
      /* readiness ring */
      .ring-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .verdict {
        font-weight: 650;
      }
      .factors {
        margin-top: 12px;
        display: none;
      }
      .factors.open {
        display: block;
      }
      .fbar {
        display: grid;
        grid-template-columns: 78px 1fr 34px;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
        font-size: 12.5px;
      }
      .fbar .track {
        height: 8px;
        background: var(--card2);
        border-radius: 4px;
        position: relative;
      }
      .fbar .fill {
        position: absolute;
        top: 0;
        height: 8px;
        border-radius: 4px;
      }
      .tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tile {
        background: var(--card2);
        border-radius: 10px;
        padding: 10px;
      }
      .tile .k {
        color: var(--muted);
        font-size: 11px;
      }
      .tile .v {
        font-size: 20px;
        font-weight: 650;
        margin-top: 2px;
      }
      .spark {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 26px;
        margin-top: 6px;
      }
      .spark span {
        flex: 1;
        background: var(--accent);
        border-radius: 2px;
        opacity: 0.8;
      }
      /* quick add */
      .qa-btns {
        display: flex;
        gap: 8px;
      }
      .qa-btns button {
        flex: 1;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card2);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .qa-btns button:active {
        transform: scale(0.96);
      }
      .water-bar {
        height: 10px;
        background: var(--card2);
        border-radius: 6px;
        margin: 12px 0 4px;
        overflow: hidden;
      }
      .water-bar > div {
        height: 100%;
        background: linear-gradient(90deg, #2f7fe0, #5b9cff);
        width: 0;
        transition: width 0.25s;
      }
      .faces {
        display: flex;
        gap: 8px;
        font-size: 24px;
      }
      .faces span,
      .dots span {
        cursor: pointer;
        opacity: 0.4;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .faces span.sel {
        opacity: 1;
        transform: scale(1.18);
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots span {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--card2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        opacity: 1;
        border: 1px solid var(--line);
      }
      .dots span.sel {
        background: var(--accent);
        color: #04101f;
        font-weight: 700;
      }
      /* heatmap */
      .heat {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(7, 1fr);
        gap: 3px;
      }
      .heat .cell {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 3px;
        background: #20242c;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }
      /* chart */
      svg {
        display: block;
        width: 100%;
      }
      .seg {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .seg button {
        flex: 1;
        background: var(--card2);
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 8px;
        padding: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .seg button.active {
        color: var(--text);
        border-color: var(--accent);
      }
      /* list rows */
      .lrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 2px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .lrow:last-child {
        border-bottom: 0;
      }
      .lrow .ic {
        font-size: 20px;
        width: 26px;
        text-align: center;
      }
      .lrow .meta {
        flex: 1;
      }
      .lrow .meta b {
        font-weight: 600;
      }
      .lrow .stat {
        text-align: right;
        font-size: 12px;
        color: var(--muted);
      }
      .tag {
        background: #243047;
        color: #9cc0ff;
        border-radius: 6px;
        padding: 1px 7px;
        font-size: 11px;
        font-weight: 600;
      }
      .composer textarea {
        width: 100%;
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 10px;
        resize: vertical;
        font: inherit;
      }
      .composer .crow {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        align-items: center;
      }
      .composer select,
      .composer button {
        background: var(--card2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
      }
      .composer button.save {
        background: var(--accent);
        color: #04101f;
        font-weight: 700;
        border: 0;
      }
      /* day-detail sheet */
      #scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 20;
      }
      #scrim.open {
        display: block;
      }
      #sheet {
        position: fixed;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        bottom: 0;
        width: 100%;
        max-width: 430px;
        background: var(--card);
        border-radius: 18px 18px 0 0;
        padding: 8px 16px 24px;
        z-index: 21;
        transition: transform 0.25s;
        max-height: 88vh;
        overflow-y: auto;
      }
      #sheet.open {
        transform: translateX(-50%) translateY(0);
      }
      .grab {
        width: 38px;
        height: 4px;
        background: #3a4150;
        border-radius: 2px;
        margin: 6px auto 10px;
      }
      .sheet-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .sheet-nav button {
        background: none;
        border: 0;
        color: var(--accent);
        font-size: 22px;
        cursor: pointer;
        padding: 2px 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 70px;
        background: #2b313b;
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        z-index: 30;
        display: none;
        align-items: center;
        gap: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      }
      .toast.show {
        display: flex;
      }
      .toast b {
        color: var(--accent);
        cursor: pointer;
      }
      .kv {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 13px;
      }
      .kv span b {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div class="banner">Mockup · sample data · clickable prototype (not live)</div>
      <header>
        <h1 id="hTitle">Today</h1>
        <span class="sub" id="hSub"></span>
      </header>
      <main id="view"></main>
      <nav id="nav"></nav>
    </div>

    <div id="scrim" onclick="closeSheet()"></div>
    <div id="sheet">
      <div class="grab"></div>
      <div class="sheet-nav">
        <button onclick="stepSheet(-1)">‹</button>
        <strong id="sheetDate"></strong>
        <span
          ><button onclick="stepSheet(1)">›</button><button onclick="closeSheet()">✕</button></span
        >
      </div>
      <div id="sheetBody"></div>
    </div>
    <div class="toast" id="toast"><span id="toastMsg"></span><b onclick="undoWater()">Undo</b></div>

    <script>
      // ---------- mock data ----------
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const R = rng(42);
      // Sport types and the realistic field set each one exposes.
      const ACT_TYPES = [
        { key: "run", kind: "run", icon: "🏃", name: "Aerobic run" },
        { key: "long_run", kind: "run", icon: "🏃", name: "Long run" },
        { key: "intervals", kind: "run", icon: "🏃", name: "Track intervals" },
        { key: "ride", kind: "ride", icon: "🚴", name: "Endurance ride" },
        { key: "indoor_ride", kind: "indoor_ride", icon: "🚲", name: "Indoor ride (trainer)" },
        { key: "swim", kind: "swim", icon: "🏊", name: "Pool swim" },
        { key: "hike", kind: "hike", icon: "🥾", name: "Trail hike" },
        { key: "strength", kind: "strength", icon: "🏋️", name: "Strength / gym" },
        { key: "treadmill", kind: "machine", icon: "🏃", name: "Treadmill" },
        { key: "elliptical", kind: "machine", icon: "🌀", name: "Elliptical" },
        { key: "stairmaster", kind: "machine", icon: "🪜", name: "Stairmaster" },
      ];
      function hrSeries(R, avg) {
        return Array.from({ length: 28 }, (_, i) =>
          Math.round(avg + Math.sin(i / 3) * 9 + (R() * 12 - 6))
        );
      }
      function genActivity(R) {
        const t = ACT_TYPES[Math.floor(R() * ACT_TYPES.length)];
        const a = { type: t.key, kind: t.kind, icon: t.icon, name: t.name };
        const baseHr =
          t.kind === "strength" ? 104 : t.kind === "machine" ? 134 : t.kind === "swim" ? 132 : 140;
        a.avgHr = Math.round(baseHr + R() * 20);
        a.maxHr = a.avgHr + Math.round(12 + R() * 22);
        a.hrSeries = hrSeries(R, a.avgHr);
        a.suffer = Math.round(20 + R() * 130);
        a.durMin =
          t.kind === "strength"
            ? Math.round(35 + R() * 40)
            : t.kind === "machine"
              ? Math.round(25 + R() * 35)
              : t.kind === "indoor_ride"
                ? Math.round(45 + R() * 45)
                : Math.round(40 + R() * 90);
        if (t.kind === "run") {
          a.dist =
            t.key === "long_run"
              ? +(18 + R() * 16).toFixed(1)
              : t.key === "intervals"
                ? +(8 + R() * 5).toFixed(1)
                : +(6 + R() * 16).toFixed(1);
          const pace = t.key === "intervals" ? 3.9 + R() * 0.6 : 4.6 + R() * 1.2;
          a.durMin = Math.round(a.dist * pace);
          a.paceMin = a.durMin / a.dist;
          a.cadence = Math.round(166 + R() * 16);
          a.elev = Math.round(R() * (t.key === "long_run" ? 700 : 320));
          a.splits = Array.from(
            { length: Math.min(12, Math.max(3, Math.round(a.dist))) },
            (_, i) => ({
              km: i + 1,
              pace: pace + (R() * 0.5 - 0.2),
              hr: a.avgHr + Math.round(i * 0.7 + (R() * 8 - 4)),
            })
          );
        } else if (t.kind === "ride") {
          a.dist = +(25 + R() * 75).toFixed(1);
          a.avgPower = Math.round(150 + R() * 110);
          a.np = a.avgPower + Math.round(8 + R() * 25);
          a.maxPower = a.avgPower + Math.round(180 + R() * 400);
          a.avgSpeed = +(26 + R() * 12).toFixed(1);
          a.cadence = Math.round(82 + R() * 14);
          a.elev = Math.round(R() * 1200);
          a.durMin = Math.round((a.dist / a.avgSpeed) * 60);
        } else if (t.kind === "indoor_ride") {
          a.avgPower = Math.round(160 + R() * 110);
          a.np = a.avgPower + Math.round(6 + R() * 18);
          a.maxPower = a.avgPower + Math.round(120 + R() * 350);
          a.cadence = Math.round(85 + R() * 12);
          a.virtualDist = +((a.durMin / 60) * (28 + R() * 8)).toFixed(1);
        } else if (t.kind === "swim") {
          a.distM = Math.round((1.5 + R() * 2.5) * 10) * 100;
          a.pace100 = (a.durMin * 60) / (a.distM / 100);
        } else if (t.kind === "hike") {
          a.dist = +(6 + R() * 16).toFixed(1);
          a.elev = Math.round(300 + R() * 1100);
        } else if (t.kind === "machine") {
          if (t.key === "treadmill") {
            a.dist = +(4 + R() * 8).toFixed(1);
            a.incline = +(1 + R() * 6).toFixed(1);
          }
          if (t.key === "stairmaster") a.floors = Math.round(60 + R() * 140);
          if (t.key === "elliptical") a.level = Math.round(6 + R() * 10);
        }
        a.cal = Math.round(
          a.durMin * (t.kind === "strength" ? 6 : t.kind === "swim" ? 9 : 9 + R() * 4)
        );
        if (t.kind === "run" || t.kind === "ride" || t.kind === "hike") {
          a.track = genTrack(R);
        }
        return a;
      }
      // Fake GPS route as normalized [x,y] points (0..1). Deterministic via R().
      // Shapes a wandering loop (run/hike) or a larger out-and-back-ish ride.
      function genTrack(R) {
        const n = Math.round(70 + R() * 40); // ~70-110 points
        const loop = R() > 0.4; // most are loops, some out-and-back
        const cx = 0.5,
          cy = 0.5;
        const baseR = 0.26 + R() * 0.08;
        const ph1 = R() * Math.PI * 2,
          ph2 = R() * Math.PI * 2,
          ph3 = R() * Math.PI * 2;
        const w1 = 2 + Math.floor(R() * 3),
          w2 = 3 + Math.floor(R() * 4);
        const pts = [];
        for (let i = 0; i < n; i++) {
          let p; // path parameter 0..1
          if (loop) {
            p = i / n; // full revolution closes the loop
          } else {
            // out-and-back: go out then retrace
            const half = i / (n - 1);
            p = (half <= 0.5 ? half : 1 - half) * 0.5;
          }
          const ang = p * Math.PI * 2 + ph1;
          // wandering radius so it isn't a clean circle
          const rad =
            baseR * (0.78 + 0.32 * Math.sin(w1 * ang + ph2) + 0.16 * Math.cos(w2 * ang + ph3));
          let x = cx + rad * Math.cos(ang) * 1.25; // slightly wider than tall
          let y = cy + rad * Math.sin(ang);
          // small high-freq jitter for a hand-drawn GPS feel
          x += 0.012 * Math.sin(i * 0.9 + ph2);
          y += 0.012 * Math.cos(i * 1.1 + ph3);
          pts.push([clamp(x, 0.04, 0.96), clamp(y, 0.06, 0.94)]);
        }
        return pts;
      }
      function fmtDur(min) {
        const h = Math.floor(min / 60),
          m = Math.round(min % 60);
        return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m} min`;
      }
      function fmtPace(p) {
        const m = Math.floor(p),
          s = Math.round((p - m) * 60);
        return `${m}:${String(s).padStart(2, "0")}/km`;
      }
      function fmtPace100(sec) {
        const m = Math.floor(sec / 60),
          s = Math.round(sec % 60);
        return `${m}:${String(s).padStart(2, "0")}/100m`;
      }
      function actLine(a) {
        if (a.kind === "run") return `${a.dist} km · ${fmtDur(a.durMin)} · ${fmtPace(a.paceMin)}`;
        if (a.kind === "ride") return `${a.dist} km · ${fmtDur(a.durMin)} · ${a.avgPower} W`;
        if (a.kind === "indoor_ride") return `${fmtDur(a.durMin)} · ${a.avgPower} W (NP ${a.np})`;
        if (a.kind === "swim")
          return `${a.distM} m · ${fmtDur(a.durMin)} · ${fmtPace100(a.pace100)}`;
        if (a.kind === "hike") return `${a.dist} km · ${fmtDur(a.durMin)} · ↑${a.elev} m`;
        return `${fmtDur(a.durMin)} · HR ${a.avgHr}`;
      }
      function actStatRight(a) {
        if (a.kind === "ride" || a.kind === "indoor_ride")
          return `${a.avgPower} W<br>SS ${a.suffer}`;
        if (a.kind === "run" || a.kind === "hike") return `HR ${a.avgHr}<br>↑${a.elev} m`;
        return `HR ${a.avgHr}<br>${a.cal} kcal`;
      }
      function miniSeries(series, color) {
        const w = 320,
          h = 40,
          min = Math.min(...series),
          max = Math.max(...series);
        const sx = w / (series.length - 1),
          sy = (h - 6) / Math.max(1, max - min);
        const pts = series
          .map((v, i) => `${(i * sx).toFixed(1)},${(h - 3 - (v - min) * sy).toFixed(1)}`)
          .join(" ");
        return `<svg viewBox="0 0 ${w} ${h}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
      }
      // Inline-SVG map preview from a normalized [x,y] track. No tiles/network.
      function routeSvg(track) {
        const w = 320,
          h = 150,
          pad = 12;
        // normalize the track's own bounds so it fills the panel nicely
        let minX = 1,
          maxX = 0,
          minY = 1,
          maxY = 0;
        for (const [x, y] of track) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
        const sx = maxX - minX || 1,
          sy = maxY - minY || 1;
        const px = (x) => (pad + ((x - minX) / sx) * (w - 2 * pad)).toFixed(1);
        const py = (y) => (pad + ((y - minY) / sy) * (h - 2 * pad)).toFixed(1);
        const pts = track.map(([x, y]) => `${px(x)},${py(y)}`).join(" ");
        const first = track[0],
          last = track[track.length - 1];
        // faint grid lines for a map-ish backdrop
        let grid = "";
        for (let i = 1; i < 5; i++)
          grid += `<line x1="${(w / 5) * i}" y1="0" x2="${(w / 5) * i}" y2="${h}" stroke="var(--line)" stroke-width="1"/>`;
        for (let i = 1; i < 3; i++)
          grid += `<line x1="0" y1="${(h / 3) * i}" x2="${w}" y2="${(h / 3) * i}" stroke="var(--line)" stroke-width="1"/>`;
        return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;border-radius:10px">
            <rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="var(--card2)"/>
            <g opacity="0.5">${grid}</g>
            <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="${px(first[0])}" cy="${py(first[1])}" r="5" fill="var(--green)" stroke="var(--card)" stroke-width="1.5"/>
            <circle cx="${px(last[0])}" cy="${py(last[1])}" r="5" fill="#f85149" stroke="var(--card)" stroke-width="1.5"/>
          </svg>`;
      }
      const NDAYS = 140;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      function iso(d) {
        return d.toISOString().slice(0, 10);
      }
      function fmtDate(d) {
        return d.toLocaleDateString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }
      const hrvBaseLow = 58,
        hrvBaseUp = 74;
      const days = [];
      let chronic = 55;
      for (let i = NDAYS - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const wobble = Math.sin(i / 9) * 12;
        const sleepScore = Math.round(clamp(72 + wobble * 0.6 + (R() * 22 - 11), 30, 98));
        const sleepH = +(6.4 + wobble * 0.04 + (R() * 1.6 - 0.8)).toFixed(1);
        const hrv = Math.round(clamp(66 + wobble * 0.5 + (R() * 16 - 8), 40, 92));
        const rhr = Math.round(clamp(49 - wobble * 0.15 + (R() * 5 - 2), 42, 60));
        const trained = R() > 0.32;
        const acute = Math.round(clamp(chronic + wobble * 1.5 + (R() * 30 - 12), 10, 130));
        chronic = chronic * 0.94 + acute * 0.06;
        const acwr = +(acute / Math.max(20, chronic)).toFixed(2);
        const stress = Math.round(clamp(30 + (R() * 40 - 20) - wobble * 0.4, 10, 80));
        const bb = Math.round(clamp(55 + wobble * 0.7 + (R() * 30 - 15), 8, 100));
        // readiness factors (signed contributions around a 60 baseline)
        const fSleep = Math.round((sleepScore - 65) * 0.45);
        const fLoad = Math.round((1.05 - acwr) * 40);
        const fHrv = Math.round(((hrv - hrvBaseLow) / (hrvBaseUp - hrvBaseLow)) * 16 - 4);
        const fStress = Math.round((40 - stress) * 0.25);
        const energy = Math.max(1, Math.min(5, Math.round(3 + wobble * 0.08 + (R() * 2 - 1))));
        const fSubj = (energy - 3) * 4;
        const score = Math.round(clamp(60 + fSleep + fLoad + fHrv + fStress + fSubj, 8, 99));
        const act = trained ? genActivity(R) : null;
        days.push({
          date: iso(d),
          dObj: d,
          score,
          sleepScore,
          sleepH,
          hrv,
          rhr,
          bb,
          acwr,
          acute: Math.round(acute),
          chronic: Math.round(chronic),
          stress,
          energy,
          soreness: Math.max(1, Math.min(5, 6 - energy + Math.round(R() * 1.5 - 0.7))),
          mood: energy,
          steps: Math.round(4000 + R() * 9000),
          weight: +(71 + Math.sin(i / 20) * 0.8).toFixed(1),
          act,
          factors: [
            ["Sleep", fSleep],
            ["Prior load", fLoad],
            ["HRV", fHrv],
            ["Stress", fStress],
            ["Subjective", fSubj],
          ],
        });
      }
      function clamp(n, a, b) {
        return Math.max(a, Math.min(b, n));
      }
      const byDate = Object.fromEntries(days.map((d) => [d.date, d]));
      const TODAY = days[days.length - 1];

      // journal
      const journal = [
        {
          date: days[days.length - 1].date,
          tag: "note",
          text: "Legs a touch heavy this morning, loosened up by the afternoon.",
        },
        {
          date: days[days.length - 4].date,
          tag: "travel",
          text: "Red-eye flight, slept badly. Easy day.",
        },
        {
          date: days[days.length - 9].date,
          tag: "race",
          text: "Local 10k — felt strong, negative split. PB by 18s!",
        },
        {
          date: days[days.length - 15].date,
          tag: "niggle",
          text: "Right calf tight after the hill reps, watching it.",
        },
      ];

      // water quick-action state
      const GOAL = 2500;
      let water = 1200;
      const waterStack = [];

      // ---------- helpers ----------
      function band(score) {
        return score >= 75
          ? ["Prime", "var(--green)"]
          : score >= 55
            ? ["High", "var(--green)"]
            : score >= 40
              ? ["Moderate", "var(--amber)"]
              : score >= 25
                ? ["Low", "var(--red)"]
                : ["Poor", "var(--red)"];
      }
      function el(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      }
      function ringSVG(score) {
        const [lbl, col] = band(score);
        const r = 34,
          c = 2 * Math.PI * r,
          off = c * (1 - score / 100);
        return `<svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/>
          <circle cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 46 46)"/>
          <text x="46" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="var(--text)">${score}</text>
          <text x="46" y="64" text-anchor="middle" font-size="9" fill="var(--muted)">/100</text></svg>`;
      }
      function lineChart(vals, w, h, zones) {
        const min = Math.min(...vals),
          max = Math.max(...vals),
          pad = 4;
        const sx = w / (vals.length - 1),
          sy = (h - pad * 2) / Math.max(1, max - min);
        const pts = vals
          .map((v, i) => `${(i * sx).toFixed(1)},${(h - pad - (v - min) * sy).toFixed(1)}`)
          .join(" ");
        let bands = "";
        if (zones) {
          const zb = [
            [0, 40, "#f8514922"],
            [40, 55, "#d6a02022"],
            [55, 100, "#3fb95022"],
          ];
          bands = zb
            .map(([lo, hi, c]) => {
              const y1 = h - pad - (clamp(hi, min, max) - min) * sy,
                y2 = h - pad - (clamp(lo, min, max) - min) * sy;
              return `<rect x="0" y="${y1}" width="${w}" height="${Math.max(0, y2 - y1)}" fill="${c}"/>`;
            })
            .join("");
        }
        return `<svg viewBox="0 0 ${w} ${h}" height="${h}">${bands}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
      }

      // ---------- views ----------
      const views = {
        today: renderToday,
        calendar: renderCalendar,
        trends: renderTrends,
        activities: renderActivities,
        journal: renderJournal,
      };
      let factorsOpen = false;

      function renderToday() {
        const d = TODAY;
        const [lbl, col] = band(d.score);
        const wpct = Math.min(100, (water / GOAL) * 100);
        const last7 = days.slice(-7);
        const v = el(`<div>
          <div class="card">
            <h3>Readiness · <span class="muted" style="text-transform:none">reconstructed ⓘ</span></h3>
            <div class="ring-wrap">
              ${ringSVG(d.score)}
              <div>
                <div class="verdict" style="color:${col}">${lbl}</div>
                <div class="tiny muted">${d.score >= 55 ? "Recovered — proceed as planned" : "Ease intensity today"}</div>
                <div class="tiny tap" style="margin-top:8px;color:var(--accent)" id="ftog">Show factor breakdown ▾</div>
              </div>
            </div>
            <div class="factors ${factorsOpen ? "open" : ""}" id="facs">
              ${d.factors
                .map(([n, val]) => {
                  const w = Math.min(50, Math.abs(val) * 3.2);
                  const pos = val >= 0;
                  return `<div class="fbar"><span class="muted">${n}</span><div class="track"><div class="fill" style="left:${pos ? "50%" : 50 - w + "%"};width:${w}%;background:${pos ? "var(--green)" : "var(--red)"}"></div></div><span style="text-align:right">${val > 0 ? "+" : ""}${val}</span></div>`;
                })
                .join("")}
              <div class="tiny muted" style="margin-top:6px">Window: last night vs trailing baseline · all inputs present ✓</div>
            </div>
          </div>
          <div class="card">
            <h3>Sleep</h3>
            <div class="row" style="align-items:baseline"><div class="big">${d.sleepH}h</div><div class="muted">score ${d.sleepScore}</div></div>
            <div class="spark">${last7.map((x) => `<span style="height:${20 + x.sleepScore * 0.5}%"></span>`).join("")}</div>
          </div>
          <div class="tiles">
            <div class="tile"><div class="k">Body Battery</div><div class="v">${d.bb}</div></div>
            <div class="tile"><div class="k">Resting HR (7d)</div><div class="v">${d.rhr}</div></div>
            <div class="tile"><div class="k">HRV ${d.hrv >= hrvBaseLow ? "✓ in band" : "↓ below"}</div><div class="v">${d.hrv}<span class="tiny muted"> /${hrvBaseLow}–${hrvBaseUp}</span></div></div>
            <div class="tile"><div class="k">Load (ACWR)</div><div class="v">${d.acwr <= 1.3 && d.acwr >= 0.8 ? '<span style="color:var(--green)">Optimal</span>' : '<span style="color:var(--amber)">Caution</span>'}<span class="tiny muted"> ${d.acwr}</span></div></div>
          </div>
          <div class="card"><h3>Today's plan</h3><div><b>Z2 run · 60 min · ~8.5 km</b><div class="tiny muted">Keep HR &lt; 145. Easy aerobic.</div></div></div>
          <div class="card">
            <h3>Quick add</h3>
            <div class="tiny muted">Water · ${water} / ${GOAL} ml</div>
            <div class="water-bar"><div id="wfill" style="width:${wpct}%"></div></div>
            <div class="qa-btns">
              <button onclick="addWater(100)">+100</button>
              <button onclick="addWater(250)">+250</button>
              <button onclick="addWater(500)">+500</button>
            </div>
            <div style="margin-top:14px" class="tiny muted">Mood</div>
            <div class="faces" id="mood">${["😖", "😐", "🙂", "😄", "🤩"].map((f, i) => `<span data-i="${i + 1}" class="${d.mood === i + 1 ? "sel" : ""}" onclick="pick(this,'mood')">${f}</span>`).join("")}</div>
            <div style="margin-top:12px" class="tiny muted">Energy</div>
            <div class="dots" id="energy">${[1, 2, 3, 4, 5].map((i) => `<span data-i="${i}" class="${d.energy === i ? "sel" : ""}" onclick="pick(this,'energy')">${i}</span>`).join("")}</div>
            <div class="tiny tap" style="margin-top:12px;color:var(--accent)" onclick="go('journal')">✎ Add journal note ›</div>
          </div>
        </div>`);
        v.querySelector("#ftog").onclick = () => {
          factorsOpen = !factorsOpen;
          v.querySelector("#facs").classList.toggle("open");
          v.querySelector("#ftog").textContent = factorsOpen
            ? "Hide factor breakdown ▴"
            : "Show factor breakdown ▾";
        };
        return v;
      }

      function renderCalendar() {
        const wk = days.slice(-Math.floor(days.length / 7) * 7); // whole weeks
        const v = el(`<div>
          <div class="card">
            <h3>Calendar · readiness</h3>
            <div class="heat" id="heat"></div>
            <div class="legend">Less <i style="background:#20242c"></i><i style="background:#1f3a25"></i><i style="background:#2f7a3a"></i><i style="background:#3fb950"></i> More</div>
            <div class="tiny muted" style="margin-top:8px">Tap a day for the full detail. Colour = readiness; a dot marks a training day.</div>
          </div>
        </div>`);
        const heat = v.querySelector("#heat");
        wk.forEach((x) => {
          const s = x.score;
          const c = s < 35 ? "#20242c" : s < 50 ? "#1f3a25" : s < 68 ? "#2f7a3a" : "#3fb950";
          const cell = el(
            `<div class="cell tap" title="${fmtDate(x.dObj)} · readiness ${s}" style="background:${c};position:relative"></div>`
          );
          if (x.act)
            cell.innerHTML = `<i style="position:absolute;right:1px;bottom:1px;width:4px;height:4px;border-radius:50%;background:#cfe;opacity:.8"></i>`;
          cell.onclick = () => openSheet(x.date);
          heat.appendChild(cell);
        });
        return v;
      }

      let trendRange = 42;
      function renderTrends() {
        const slice = days.slice(-trendRange);
        const v = el(`<div>
          <div class="seg" id="seg">
            ${[
              ["7d", 7],
              ["6w", 42],
              ["Season", days.length],
            ]
              .map(
                ([l, n]) =>
                  `<button data-n="${n}" class="${trendRange === n ? "active" : ""}">${l}</button>`
              )
              .join("")}
          </div>
          <div class="card"><h3>Readiness</h3>${lineChart(
            slice.map((x) => x.score),
            360,
            120,
            true
          )}<div class="tiny muted">avg ${Math.round(slice.reduce((a, x) => a + x.score, 0) / slice.length)} · band-zoned (low/mod/high)</div></div>
          <div class="card"><h3>HRV vs baseline (${hrvBaseLow}–${hrvBaseUp})</h3>
            <svg viewBox="0 0 360 110" height="110">
              <rect x="0" y="${110 - 4 - (hrvBaseUp - 30) * 1.0}" width="360" height="${(hrvBaseUp - hrvBaseLow) * 1.0}" fill="#3fb95022"/>
              <polyline points="${slice.map((x, i) => `${((i * 360) / (slice.length - 1)).toFixed(1)},${(110 - 4 - (x.hrv - 30) * 1.0).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>
            </svg></div>
          <div class="card"><h3>Acute vs chronic load</h3>${lineChart(
            slice.map((x) => x.acute),
            360,
            100,
            false
          )}<div class="tiny muted">acute load; chronic trails below — divergence = ramp/risk</div></div>
        </div>`);
        v.querySelectorAll("#seg button").forEach(
          (b) =>
            (b.onclick = () => {
              trendRange = +b.dataset.n;
              mount();
            })
        );
        return v;
      }

      function renderActivities() {
        const acts = days
          .filter((d) => d.act)
          .slice(-30)
          .reverse();
        const v = el(
          `<div class="card"><h3>Activities</h3>${acts
            .map(
              (d) => `
          <div class="lrow" onclick="openActivity('${d.date}')">
            <div class="ic">${d.act.icon}</div>
            <div class="meta"><b>${d.act.name}</b><div class="tiny muted">${fmtDate(d.dObj)} · ${actLine(d.act)}</div></div>
            <div class="stat">${actStatRight(d.act)}</div>
          </div>`
            )
            .join("")}</div>`
        );
        return v;
      }

      function renderJournal() {
        const v = el(`<div>
          <div class="card composer">
            <h3>New entry</h3>
            <textarea id="jtext" rows="2" placeholder="How did today feel?"></textarea>
            <div class="crow">
              <select id="jtag"><option>note</option><option>race</option><option>niggle</option><option>travel</option><option>illness</option></select>
              <span class="muted tiny" style="flex:1">today</span>
              <button class="save" onclick="addJournal()">Save</button>
            </div>
          </div>
          <div class="card"><h3>Journal</h3><div id="jlist">${journal.map((j) => journalRow(j)).join("")}</div></div>
        </div>`);
        return v;
      }
      function journalRow(j) {
        const d = byDate[j.date];
        return `<div class="lrow" onclick="openSheet('${j.date}')"><div class="meta"><span class="tag">#${j.tag}</span> <span class="tiny muted">${d ? fmtDate(d.dObj) : j.date}</span><div style="margin-top:4px">${j.text}</div></div></div>`;
      }

      // ---------- detail sheet (day OR activity) ----------
      let sheetDate = null;
      let sheetMode = "day";
      function showSheet() {
        document.getElementById("scrim").classList.add("open");
        document.getElementById("sheet").classList.add("open");
      }
      function openSheet(date) {
        sheetMode = "day";
        sheetDate = date;
        renderSheet();
        showSheet();
      }
      function openActivity(date) {
        sheetMode = "activity";
        sheetDate = date;
        renderSheet();
        showSheet();
      }
      function closeSheet() {
        document.getElementById("scrim").classList.remove("open");
        document.getElementById("sheet").classList.remove("open");
      }
      function stepSheet(n) {
        const i = days.findIndex((d) => d.date === sheetDate);
        if (sheetMode === "activity") {
          for (let k = i + n; k >= 0 && k < days.length; k += n) {
            if (days[k].act) {
              sheetDate = days[k].date;
              renderSheet();
              return;
            }
          }
          return;
        }
        sheetDate = days[clamp(i + n, 0, days.length - 1)].date;
        renderSheet();
      }
      function addNoteForDay(date) {
        closeSheet();
        go("journal");
        showToast("Tip: log extra detail for " + fmtDate(byDate[date].dObj) + " here");
      }
      function renderSheet() {
        if (sheetMode === "activity" && byDate[sheetDate].act)
          renderActivitySheet(byDate[sheetDate]);
        else {
          sheetMode = "day";
          renderDaySheet();
        }
      }
      function renderDaySheet() {
        const d = byDate[sheetDate];
        const [lbl, col] = band(d.score);
        document.getElementById("sheetDate").textContent = fmtDate(d.dObj);
        const js = journal.filter((j) => j.date === d.date);
        document.getElementById("sheetBody").innerHTML = `
          <div class="card" style="margin-top:4px">
            <div class="row" style="align-items:center"><div class="big" style="color:${col}">${d.score}</div><div class="verdict" style="color:${col};flex:0">${lbl}</div></div>
            ${d.factors
              .map(([n, val]) => {
                const w = Math.min(50, Math.abs(val) * 3.2);
                const pos = val >= 0;
                return `<div class="fbar"><span class="muted">${n}</span><div class="track"><div class="fill" style="left:${pos ? "50%" : 50 - w + "%"};width:${w}%;background:${pos ? "var(--green)" : "var(--red)"}"></div></div><span style="text-align:right">${val > 0 ? "+" : ""}${val}</span></div>`;
              })
              .join("")}
          </div>
          <div class="card"><div class="kv">
            <span>Sleep <b>${d.sleepH}h</b> (${d.sleepScore})</span><span>HRV <b>${d.hrv}</b></span><span>RHR <b>${d.rhr}</b></span>
            <span>Body batt <b>${d.bb}</b></span><span>Stress <b>${d.stress}</b></span><span>ACWR <b>${d.acwr}</b></span>
            <span>Steps <b>${d.steps.toLocaleString()}</b></span><span>Weight <b>${d.weight}kg</b></span>
          </div></div>
          ${d.act ? `<div class="card lrow tap" style="border-radius:14px" onclick="openActivity('${d.date}')"><div class="ic">${d.act.icon}</div><div class="meta"><b>${d.act.name}</b><div class="tiny muted">${actLine(d.act)}</div></div><div class="stat" style="color:var(--accent);font-size:18px">›</div></div>` : `<div class="card tiny muted">No activity logged.</div>`}
          <div class="card"><div class="tiny muted">Subjective</div><div>Energy ${d.energy}/5 · Soreness ${d.soreness}/5 · Mood ${["", "😖", "😐", "🙂", "😄", "🤩"][d.mood]}</div></div>
          ${js.length ? `<div class="card"><div class="tiny muted">Journal</div>${js.map((j) => `<div style="margin-top:4px"><span class="tag">#${j.tag}</span> ${j.text}</div>`).join("")}</div>` : ""}
        `;
      }
      function renderActivitySheet(d) {
        const a = d.act;
        document.getElementById("sheetDate").textContent = `${a.icon} ${a.name}`;
        const stat = (k, v) =>
          `<span style="min-width:74px"><b>${v}</b><br><span class="tiny muted">${k}</span></span>`;
        const g = [stat("Duration", fmtDur(a.durMin))];
        if (a.kind === "run")
          g.push(
            stat("Distance", a.dist + " km"),
            stat("Avg pace", fmtPace(a.paceMin)),
            stat("Avg HR", a.avgHr),
            stat("Max HR", a.maxHr),
            stat("Cadence", a.cadence + " spm"),
            stat("Elev", "↑" + a.elev + " m"),
            stat("Calories", a.cal),
            stat("Effort", a.suffer)
          );
        else if (a.kind === "ride")
          g.push(
            stat("Distance", a.dist + " km"),
            stat("Avg power", a.avgPower + " W"),
            stat("Norm power", a.np + " W"),
            stat("Max power", a.maxPower + " W"),
            stat("Avg speed", a.avgSpeed + " km/h"),
            stat("Avg HR", a.avgHr),
            stat("Elev", "↑" + a.elev + " m"),
            stat("Calories", a.cal)
          );
        else if (a.kind === "indoor_ride")
          g.push(
            stat("Avg power", a.avgPower + " W"),
            stat("Norm power", a.np + " W"),
            stat("Max power", a.maxPower + " W"),
            stat("Cadence", a.cadence + " rpm"),
            stat("Avg HR", a.avgHr),
            stat("Max HR", a.maxHr),
            stat("Virtual dist", a.virtualDist + " km"),
            stat("Calories", a.cal)
          );
        else if (a.kind === "swim")
          g.push(
            stat("Distance", a.distM + " m"),
            stat("Avg pace", fmtPace100(a.pace100)),
            stat("Avg HR", a.avgHr),
            stat("Calories", a.cal)
          );
        else if (a.kind === "hike")
          g.push(
            stat("Distance", a.dist + " km"),
            stat("Elev", "↑" + a.elev + " m"),
            stat("Avg HR", a.avgHr),
            stat("Calories", a.cal)
          );
        else if (a.kind === "strength")
          g.push(stat("Avg HR", a.avgHr), stat("Max HR", a.maxHr), stat("Calories", a.cal));
        else if (a.kind === "machine") {
          g.push(stat("Avg HR", a.avgHr), stat("Max HR", a.maxHr), stat("Calories", a.cal));
          if (a.dist) g.push(stat("Distance", a.dist + " km"));
          if (a.incline) g.push(stat("Incline", a.incline + " %"));
          if (a.floors) g.push(stat("Floors", a.floors));
          if (a.level) g.push(stat("Level", a.level));
        }
        const minimal = a.kind === "strength" || a.kind === "machine";
        const power =
          a.kind === "ride" || a.kind === "indoor_ride"
            ? `<div class="card"><h3>Power (sample)</h3>${miniSeries(
                a.hrSeries.map((h, i) => Math.max(0, a.avgPower - 25 + i * 2 + (h - a.avgHr) * 3)),
                "#e8a13a"
              )}<div class="tiny muted">avg ${a.avgPower} W · NP ${a.np} · max ${a.maxPower} W</div></div>`
            : "";
        const splits = a.splits
          ? `<div class="card"><h3>Splits</h3><table style="width:100%;font-size:13px;border-collapse:collapse">${a.splits.map((s) => `<tr><td class="muted">km ${s.km}</td><td style="text-align:right">${fmtPace(s.pace)}</td><td style="text-align:right" class="muted">${Math.round(s.hr)} bpm</td></tr>`).join("")}</table></div>`
          : "";
        const route = a.track
          ? `<div class="card"><h3>Route</h3>${routeSvg(a.track)}<div class="tiny muted" style="margin-top:6px">Route preview</div></div>`
          : "";
        const course = a.track
          ? `<div class="card tap" id="courseCard" onclick="createCourse('${d.date}')"><b style="color:var(--accent)">⛰ Create Garmin course from this activity ›</b></div>`
          : "";
        document.getElementById("sheetBody").innerHTML = `
          <div class="card" style="margin-top:4px"><div class="tiny muted">${fmtDate(d.dObj)}</div>
            <div class="kv" style="gap:14px 18px;margin-top:8px">${g.join("")}</div></div>
          ${route}
          <div class="card"><h3>Heart rate (sample)</h3>${miniSeries(a.hrSeries, "#f85149")}<div class="tiny muted">avg ${a.avgHr} · max ${a.maxHr} bpm</div></div>
          ${power}${splits}
          ${course}
          ${minimal ? `<div class="card tiny muted">This session records <b>duration & heart rate</b>${a.dist ? " (and distance)" : ""} only. Sets/reps, incline or level aren't part of the activity record — log them as a note for this day.</div>` : ""}
          <div class="card tap" onclick="openSheet('${d.date}')"><b style="color:var(--accent)">View full day ›</b></div>
          <div class="card tap" onclick="addNoteForDay('${d.date}')"><b style="color:var(--accent)">＋ Log extra for this day (journal) ›</b></div>
        `;
      }

      // ---------- interactions ----------
      function addWater(ml) {
        water += ml;
        waterStack.push(ml);
        refreshWater();
        showToast("Added " + ml + " ml");
      }
      function undoWater() {
        const last = waterStack.pop();
        if (last) {
          water -= last;
          refreshWater();
        }
        hideToast();
      }
      function refreshWater() {
        const f = document.getElementById("wfill");
        if (f) {
          f.style.width = Math.min(100, (water / GOAL) * 100) + "%";
          const lbl = f.closest(".card").querySelector(".muted");
          if (lbl) lbl.textContent = "Water · " + water + " / " + GOAL + " ml";
        }
      }
      let toastTimer;
      function showToast(m) {
        const t = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = m;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 5000);
      }
      function hideToast() {
        document.getElementById("toast").classList.remove("show");
      }
      // Simulated, client-only: pretend to build a Garmin course from the route.
      function createCourse(date) {
        const d = byDate[date];
        const name = d && d.act ? d.act.name : "activity";
        showToast("Creating course…");
        const card = document.getElementById("courseCard");
        if (card) {
          card.onclick = null;
          card.classList.remove("tap");
          card.innerHTML = `<b style="color:var(--muted)">⛰ Creating course…</b>`;
        }
        setTimeout(() => {
          const c = document.getElementById("courseCard");
          if (c)
            c.innerHTML = `<b style="color:var(--green)">✓ Course created — it'll sync to your watch</b><div class="tiny muted" style="margin-top:4px">From “${name}” · ready for your next session</div>`;
          showToast("✓ Course created from " + name);
        }, 700);
      }
      function pick(span, grp) {
        document.querySelectorAll("#" + grp + " span").forEach((s) => s.classList.remove("sel"));
        span.classList.add("sel");
      }
      function addJournal() {
        const t = document.getElementById("jtext").value.trim();
        if (!t) return;
        journal.unshift({ date: TODAY.date, tag: document.getElementById("jtag").value, text: t });
        document.getElementById("jlist").innerHTML = journal.map((j) => journalRow(j)).join("");
        document.getElementById("jtext").value = "";
        showToast("Journal saved");
      }

      // ---------- nav / mount ----------
      let current = "today";
      const NAVS = [
        ["today", "Today", "◉"],
        ["calendar", "Calendar", "▦"],
        ["trends", "Trends", "📈"],
        ["activities", "Activity", "🏃"],
        ["journal", "Journal", "✎"],
      ];
      function go(v) {
        current = v;
        mount();
      }
      function mount() {
        document.getElementById("hTitle").textContent = NAVS.find((n) => n[0] === current)[1];
        document.getElementById("hSub").textContent =
          current === "today" ? fmtDate(TODAY.dObj) : "";
        const view = document.getElementById("view");
        view.innerHTML = "";
        view.appendChild(views[current]());
        view.scrollTop = 0;
        document.getElementById("nav").innerHTML = NAVS.map(
          (n) =>
            `<button class="${current === n[0] ? "active" : ""}" onclick="go('${n[0]}')"><span class="ico">${n[2]}</span>${n[1]}</button>`
        ).join("");
      }
      mount();
    </script>
  </body>
</html>
